<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THEIA SOUL</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00ff41;
    --green-dim: #00cc33;
    --green-dark: #003b0f;
    --green-faint: rgba(0,255,65,0.07);
    --bg: #0a0a0a;
    --bg2: #0f0f0f;
    --bg3: #141414;
    --border: rgba(0,255,65,0.18);
    --border-bright: rgba(0,255,65,0.45);
    --text: #c8ffc8;
    --text-dim: rgba(200,255,200,0.45);
    --font-mono: 'Share Tech Mono', monospace;
    --font-ui: 'Rajdhani', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
  }

  /* Matrix rain canvas */
  #matrix-rain {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    opacity: 0.045;
    z-index: 0;
  }

  /* Scanline overlay */
  body::after {
    content: '';
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    border-bottom: 1px solid var(--border);
    padding: 10px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(10,10,10,0.95);
    backdrop-filter: blur(8px);
  }

  .logo {
    font-family: var(--font-ui);
    font-weight: 600;
    font-size: 22px;
    letter-spacing: 8px;
    color: var(--green);
    text-transform: uppercase;
  }

  .logo span {
    color: var(--text-dim);
    font-weight: 300;
    font-size: 13px;
    letter-spacing: 3px;
    margin-left: 12px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 20px;
  }

  .model-selector {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--green-dim);
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 5px 10px;
    cursor: pointer;
    outline: none;
    letter-spacing: 1px;
    transition: border-color 0.2s;
  }

  .model-selector:hover { border-color: var(--border-bright); }
  .model-selector option { background: #0a0a0a; }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Chat area */
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    position: relative;
    z-index: 10;
    scroll-behavior: smooth;
  }

  #chat::-webkit-scrollbar { width: 4px; }
  #chat::-webkit-scrollbar-track { background: transparent; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg {
    display: flex;
    gap: 14px;
    margin-bottom: 20px;
    animation: fadeIn 0.25s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .msg-tag {
    font-size: 10px;
    letter-spacing: 2px;
    color: var(--text-dim);
    margin-top: 3px;
    min-width: 56px;
    text-align: right;
    flex-shrink: 0;
    padding-top: 2px;
  }

  .msg.user .msg-tag { color: rgba(0,255,65,0.5); }

  .msg-body {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text);
    max-width: 720px;
    word-break: break-word;
  }

  .msg.user .msg-body {
    color: var(--green);
  }

  .msg-body pre {
    background: var(--green-faint);
    border: 1px solid var(--border);
    border-left: 2px solid var(--green-dim);
    padding: 12px 16px;
    margin: 10px 0;
    overflow-x: auto;
    font-size: 13px;
    border-radius: 0;
  }

  .msg-body code {
    background: var(--green-faint);
    padding: 1px 5px;
    font-family: var(--font-mono);
    font-size: 13px;
    border: 1px solid var(--border);
  }

  /* Typing indicator */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 4px 0;
  }

  .typing-indicator span {
    width: 6px; height: 6px;
    background: var(--green);
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; transform: scale(0.8); }
    40% { opacity: 1; transform: scale(1); }
  }

  /* Boot message */
  .boot-msg {
    text-align: center;
    padding: 40px 0;
    color: var(--text-dim);
    font-size: 12px;
    letter-spacing: 2px;
  }

  .boot-msg .ascii {
    color: rgba(0,255,65,0.25);
    font-size: 11px;
    line-height: 1.4;
    margin-bottom: 20px;
    white-space: pre;
  }

  /* Input area */
  footer {
    position: relative;
    z-index: 10;
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    background: rgba(10,10,10,0.97);
    backdrop-filter: blur(8px);
  }

  .input-row {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    border: 1px solid var(--border);
    padding: 10px 14px;
    transition: border-color 0.2s;
    background: var(--bg2);
  }

  .input-row:focus-within {
    border-color: var(--border-bright);
    box-shadow: 0 0 12px rgba(0,255,65,0.06);
  }

  .input-prompt {
    color: var(--green-dim);
    font-size: 14px;
    padding-bottom: 1px;
    flex-shrink: 0;
    user-select: none;
  }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--green);
    font-family: var(--font-mono);
    font-size: 14px;
    outline: none;
    resize: none;
    min-height: 22px;
    max-height: 120px;
    line-height: 1.5;
    caret-color: var(--green);
  }

  #user-input::placeholder { color: var(--text-dim); }

  .send-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--green-dim);
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 2px;
    padding: 6px 14px;
    cursor: pointer;
    transition: all 0.15s;
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .send-btn:hover {
    border-color: var(--green);
    color: var(--green);
    background: var(--green-faint);
  }

  .send-btn:active { transform: scale(0.97); }

  .footer-hint {
    margin-top: 8px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
    display: flex;
    justify-content: space-between;
  }

  /* Error */
  .error-msg {
    color: #ff4141;
    font-size: 12px;
    padding: 4px 0;
  }

  /* Session counter */
  #session-id {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<canvas id="matrix-rain"></canvas>

<header>
  <div>
    <div class="logo">THEIA <span>SOUL // v0.1</span></div>
  </div>
  <div class="header-right">
    <select class="model-selector" id="model-select">
      <option value="claude">CLAUDE</option>
      <option value="deepseek">DEEPSEEK</option>
      <option value="kimi">KIMI</option>
      <option value="ollama">OLLAMA</option>
    </select>
    <span id="session-id">SES://—</span>
    <div class="status-dot"></div>
  </div>
</header>

<div id="chat">
  <div class="boot-msg">
    <div class="ascii">
 _____ _   _ _____ ___   _
|_   _| | | | ____|_ _| / \
  | | | |_| |  _|  | | / _ \
  | | |  _  | |___ | |/ ___ \
  |_| |_| |_|_____|___/_/   \_\
    </div>
    <div>SYSTEM ONLINE — AWAITING INPUT</div>
  </div>
</div>

<footer>
  <div class="input-row">
    <span class="input-prompt">&gt;_</span>
    <textarea id="user-input" rows="1" placeholder="mesajını gir..."></textarea>
    <button class="send-btn" id="send-btn">GÖNDER</button>
  </div>
  <div class="footer-hint">
    <span>ENTER → gönder &nbsp;|&nbsp; SHIFT+ENTER → yeni satır</span>
    <span id="char-count">0</span>
  </div>
</footer>

<script>
// === Matrix Rain ===
const canvas = document.getElementById('matrix-rain');
const ctx = canvas.getContext('2d');
let cols, drops;

function initMatrix() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  const fontSize = 14;
  cols = Math.floor(canvas.width / fontSize);
  drops = Array(cols).fill(1);
}

function drawMatrix() {
  ctx.fillStyle = 'rgba(10,10,10,0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00ff41';
  ctx.font = '14px Share Tech Mono';
  const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ01';
  for (let i = 0; i < drops.length; i++) {
    const ch = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(ch, i * 14, drops[i] * 14);
    if (drops[i] * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
    drops[i]++;
  }
}

initMatrix();
setInterval(drawMatrix, 55);
window.addEventListener('resize', initMatrix);

// === State ===
let sessionId = null;
const model = () => document.getElementById('model-select').value;
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('user-input');

// === Session ===
async function ensureSession() {
  if (sessionId) return;
  sessionId = 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = Math.random() * 16 | 0;
    return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
  document.getElementById('session-id').textContent = 'SES://' + sessionId.slice(0, 8).toUpperCase();
}

// === Render ===
function appendMsg(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const tag = document.createElement('div');
  tag.className = 'msg-tag';
  tag.textContent = role === 'user' ? 'SEN' : 'THEIA';

  const body = document.createElement('div');
  body.className = 'msg-body';

  // Basic markdown: code blocks
  let html = content
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/^### (.+)$/gm, '<strong style="color:var(--green)">$1</strong>')
    .replace(/^## (.+)$/gm, '<strong style="font-size:15px;color:var(--green)">$1</strong>')
    .replace(/^# (.+)$/gm, '<strong style="font-size:16px;color:var(--green)">$1</strong>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/^---$/gm, '<hr style="border-color:var(--border);margin:8px 0">')
    .replace(/\n/g, '<br>');;

  body.innerHTML = html;
  div.appendChild(tag);
  div.appendChild(body);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
  return body;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg assistant';
  div.id = 'typing-msg';

  const tag = document.createElement('div');
  tag.className = 'msg-tag';
  tag.textContent = 'THEIA';

  const body = document.createElement('div');
  body.className = 'msg-body';
  body.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

  div.appendChild(tag);
  div.appendChild(body);
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-msg');
  if (el) el.remove();
}

// === Send ===
async function send() {
  const text = inputEl.value.trim();
  if (!text) return;

  inputEl.value = '';
  inputEl.style.height = 'auto';
  document.getElementById('char-count').textContent = '0';

  appendMsg('user', text);
  showTyping();

  try {
    await ensureSession();

    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, message: text, model: model() })
    });

    removeTyping();

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      appendMsg('assistant', '[ HATA: ' + (err.detail || res.status) + ' ]');
      return;
    }

    const data = await res.json();
    appendMsg('assistant', data.message || data.response || data.content || JSON.stringify(data));

  } catch (e) {
    removeTyping();
    appendMsg('assistant', '[ BAĞLANTI HATASI: ' + e.message + ' ]');
  }
}

// === Input events ===
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  document.getElementById('char-count').textContent = inputEl.value.length;
});

document.getElementById('send-btn').addEventListener('click', send);

// Reset session if model changes
document.getElementById('model-select').addEventListener('change', () => {
  sessionId = null;
  document.getElementById('session-id').textContent = 'SES://—';
});
</script>
</body>
</html>
